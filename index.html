<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <meta name="description" content="Conoce el CV de Jorge Leonardo Cárdenas Montenegro, Ingeniero DevOps con experiencia en automatización, CI/CD, gestión de infraestructuras en la nube y más. Especialista en herramientas como Docker, Kubernetes y AWS.">
    <title>Devops page</title>
    <link rel="icon" href="public/assets/logo.png" sizes="32x32" type="image/png">
    <link rel="icon" href="public/assets/logo.png" sizes="16x16" type="image/png">
</head>
<body>
      <!-- Menu -->
      <nav class="navbar bg-dark navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html"><img class="menu-logo" src="public/assets/logo.png" alt=""></a>
          <div class="collapse navbar-collapse justify-content-end menu-list" id="navbarNavDropdown">
            <ul class="navbar-nav menu-ul" id="menuDevops">
            </ul>
            <div class="menu-login">
              <!-- Button trigger modal -->
              <button type="button" class="btn menu-boton" data-bs-toggle="modal" data-bs-target="#exampleModal">
                Login
              </button>
              <!-- Modal -->
              <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <a class="navbar-brand" href="index.html"><img class="modal-menu-logo" src="public/assets/logo.png" alt=""></a>
                    </div>
                    <div class="modal-body">
                      <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput">Usuario</label>
                      </div>
                      <div class="form-floating" id="login-pass">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Contraseña</label>
                      </div>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                      <button type="button" class="btn btn-success">Enviar</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
    </nav>
    <script src="public/js/app.js"></script>
    <script src="views/menu.js"></script>
    <script src="controllers/menu.js"></script>
    <script src="models/menu.js"></script>
    <script src="data/dataMenu.js"></script>
    <script src="views/login.js"></script>
    <script src="controllers/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
